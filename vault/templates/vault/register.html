{% extends "vault/base.html" %}
{% block title %}Register - KeyForge{% endblock title %}

{% block main %}
<div class="container" sytle="max-width: 300px;">
    <h2>Register</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Username" type="text" required>
        </div>

        <div class="mb-3">
            <input class="form-control" id="email" name="email" placeholder="Email" type="email" required>
        </div>

        <div class="mb-3">
            <input class="form-control" id="password" name="password" placeholder="Password" type="password" required>
        </div>

        <div class="mb-3">
            <input class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" type="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Register</button>
    </form>
    <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Sign In</a></p>
</div>
{% endblock main %}
