{% extends "vault/base.html" %}
{% block title %}Edit Key - KeyForge{% endblock title %}

{% block main %}
<div class="container" style="max-width: 900px;">
    <h2>Edit API Key</h2>

    <form method="POST" style="max-width: 500px; margin: 0 auto;">
        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label-center">Key Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ cred.name }}" required>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label-center">Provider</label>
            <input type="text" class="form-control" id="provider" name="provider" value="{{ cred.provider }}" required>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label-center">API Key / Secret</label>
            <input type="text" class="form-control" id="value" name="value" placeholder="Leave blank to keep current value" required>
        </div>
        <button class="btn btn-primary" type="submit">Update Key</button>
    </form>

    <p class="mt-3"><a href="{% url 'dashboard' %}">Back to Vault</a></p>
</div>
{% endblock main %}
