<!DOCTYPE html>
<html>
<head>
    <title>Login - KeyForge</title>
</head>
<body>
    <h2>Log in to KeyForge</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
</body>
</html>
