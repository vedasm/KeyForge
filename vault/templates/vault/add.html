{% extends "vault/base.html" %}
{% block title %}Add Key - KeyForge{% endblock title %}

{% block main %}
<div class="container" style="max-width: 500px">
    <h2>Add New API Key</h2>

    <form method="POST" style="max=width: 500px; margin: 0 auto;">
        {% csrf_token %}

        <div class="mb-3">
            <label for="provider" class="form-label-center">Key Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="eg., OpenAI Production Key" required>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label-center">Provider</label>
            <input type="text" class="form-control" id="provider" name="provider" placeholder="eg., OpenAI, AWS, Stripe" required>
        </div>

        <div class="mb-3">
            <label for="value" class="form-label-center">API Key / Secret</label>
            <input type="password" class="form-control" id="value" name="value" placeholder="Paste the secret value" required>
        </div>
        <button class="btn btn-primary" type="submit">Add Key</button>
    </form>

    <p class="mt-3"><a href="{% url 'dashboard' %}">Back to Vault</a></p>
</div>
{% endblock main %}
